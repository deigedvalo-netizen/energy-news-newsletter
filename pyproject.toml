[project]
name = "energynews"
version = "0.1.0"
description = "Energy trading news newsletter pipeline"
requires-python = ">=3.11"
dependencies = [
  "feedparser==6.0.11", "httpx==0.27.2", "trafilatura==1.12.2", "scikit-learn==1.5.2",
  "Jinja2==3.1.4", "jsonschema==4.23.0", "PyYAML==6.0.2", "python-frontmatter==1.1.0",
  "Markdown==3.7", "beautifulsoup4==4.12.3",
]
[project.optional-dependencies]
dev = ["pytest==8.3.3"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
energynews = ["publish/templates/*", "publish/assets/*", "issues/*.yaml"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
